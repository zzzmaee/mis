<div style="width: 320px; margin: 16px 0">
  <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
    <input
      type="text"
      nz-input
      placeholder="Поиск"
      style="
        height: 40px;
        border: 1px solid #d9d9d9;
        border-radius: 8px 0 0 8px;
      "
      (keyup)="inputTrigger($event)"
    />
  </nz-input-group>
  <ng-template #suffixIconButton>
    <button
      nz-button
      nzType="primary"
      nzSearch
      style="
        background-color: white;
        border: 1px solid #d9d9d9;
        border-radius: 0 8px 8px 0;
        width: 40px;
        height: 40px;
        padding: 0;
      "
    >
      <img
        nz-image
        width="18px"
        height="18px"
        style="margin: auto"
        nzSrc="assets/images/search.svg"
        nzDisablePreview="true"
        alt=""
      />
    </button>
  </ng-template>
</div>
